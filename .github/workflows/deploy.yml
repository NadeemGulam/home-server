name: Deploy to Home Server

on:
  push:
    branches:
      - release/1.0
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Verify Tailscale connectivity
        run: |
          tailscale status
          tailscale ip -4 || true

      - name: Check SSH port reachability
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          set -e
          echo "Checking TCP connectivity to SSH port 22..."
          timeout 10 bash -lc 'cat < /dev/null > /dev/tcp/"$SERVER_IP"/22' && echo "SSH port 22 is reachable" || { echo "SSH port 22 is not reachable from runner"; exit 1; }

      - name: Probe SSH
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          ssh-keyscan -T 10 "$SERVER_IP" || echo "no SSH banner"
          tailscale ping -c 2 "$SERVER_IP" || true

      - name: Deploy to Server
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          key_file="$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KEY" > "$key_file"
          chmod 600 "$key_file"

          ssh \
            -i "$key_file" \
            -p 22 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "$SERVER_USERNAME@$SERVER_IP" 'bash -seuo pipefail' <<'REMOTE'
          cd "$HOME/workspace/home-server"
          git pull --ff-only
          docker compose up -d --build --remove-orphans
          REMOTE

          rm -f "$key_file"
