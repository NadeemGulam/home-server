version: '3.8'

services:
  gateway:
    build: ./gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - AUTH_SERVICE_URL=http://auth-service:3001
      - USERS_SERVICE_URL=http://users-service:3002
      - PRODUCTS_SERVICE_URL=http://products-service:3003
      - ORDERS_SERVICE_URL=http://orders-service:3004
      - PORTFOLIO_SERVICE_URL=http://portfolio-backend:8002
    depends_on:
      portfolio-backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - home-server-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

