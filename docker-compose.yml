version: '3.8'

services:
  gateway:
    build: ./gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - AUTH_SERVICE_URL=http://auth-service:3001
      - USERS_SERVICE_URL=http://users-service:3002
      - PRODUCTS_SERVICE_URL=http://products-service:3003
      - ORDERS_SERVICE_URL=http://orders-service:3004
      - PORTFOLIO_SERVICE_URL=http://portfolio-backend:8002
      - OTEL_SERVICE_NAME=gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAMESPACE=home-server
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=production,service.version=1.0.0
    depends_on:
      portfolio-backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - home-server-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  dashboard:
    build:
      context: ./dashboard
      args:
        # Since it's accessed from the browser, we use the host's port 3000 mapping
        - VITE_GATEWAY_URL=https://api.nadeem-dev.in
    ports:
      - "8080:80"
    networks:
      - home-server-network
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

  auth-service:
    build: ./services/auth-service
    environment:
      - PORT=3001
      - OTEL_SERVICE_NAME=auth-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAMESPACE=home-server
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=production,service.version=1.0.0
    depends_on:
      otel-collector:
        condition: service_started
    networks:
      - home-server-network
    restart: unless-stopped

  users-service:
    build: ./services/users-service
    environment:
      - PORT=3002
      - OTEL_SERVICE_NAME=users-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAMESPACE=home-server
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=production,service.version=1.0.0
    depends_on:
      otel-collector:
        condition: service_started
    networks:
      - home-server-network
    restart: unless-stopped

  products-service:
    build: ./services/products-service
    environment:
      - PORT=3003
      - OTEL_SERVICE_NAME=products-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAMESPACE=home-server
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=production,service.version=1.0.0
    depends_on:
      otel-collector:
        condition: service_started
    networks:
      - home-server-network
    restart: unless-stopped

  orders-service:
    build: ./services/orders-service
    environment:
      - PORT=3004
      - OTEL_SERVICE_NAME=orders-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAMESPACE=home-server
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=production,service.version=1.0.0
    depends_on:
      otel-collector:
        condition: service_started
    networks:
      - home-server-network
    restart: unless-stopped

  portfolio-backend:
    build: ./services/portfolio-backend
    ports:
      - "8002:8002"
    environment:
      - REDIS_HOST=redis
      - GMAIL_FROM=${GMAIL_FROM}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO}
      - OTEL_SERVICE_NAME=portfolio-backend
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAMESPACE=home-server
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=production,service.version=1.0.0
    depends_on:
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - home-server-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - home-server-network
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infrastructure/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus exporter (OTel metrics)
      - "13133:13133" # Collector health check
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - home-server-network
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infrastructure/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # Tempo HTTP/query
    networks:
      - home-server-network
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./infrastructure/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"   # Loki HTTP/API
    networks:
      - home-server-network
    restart: unless-stopped

  # Monitoring Stack
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    volumes:
      - ./infrastructure/prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    networks:
      - home-server-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3008:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./infrastructure/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    networks:
      - home-server-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  alertmanager:
    image: prom/alertmanager:latest
    environment:
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - GMAIL_FROM=${GMAIL_FROM}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO}
    ports:
      - "9093:9093"
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    command:
      - '--storage.path=/alertmanager'
    volumes:
      - ./infrastructure/alertmanager:/etc/alertmanager
      - alertmanager-data:/alertmanager
    networks:
      - home-server-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis-exporter:
    image: oliver006/redis_exporter:latest
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis:6379
    networks:
      - home-server-network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9121/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  home-server-network:
    driver: bridge

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  tempo-data:
  loki-data:
