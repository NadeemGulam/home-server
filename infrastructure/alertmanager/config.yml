global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'job']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'console-logger'

receivers:
  - name: 'console-logger'
    # For now, just log to console
    # TODO: Add email notifications
    # Example:
    # email_configs:
    #   - to: 'your-email@gmail.com'
    #     from: 'alerts@nadeem-dev.in'
    #     smarthost: 'smtp.gmail.com:587'
    #     auth_username: 'your-email@gmail.com'
    #     auth_password: 'your-app-password'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'job']
